# Minimal golangci-lint configuration (v2 schema; checked with golangci-lint v2.14.0)
#
# Migrated from the v1 file. The linter set is unchanged: v1's gosimple is now
# part of staticcheck, and gofmt/goimports are formatters in v2.

version: "2"

# Options for analysis running
run:
  timeout: 5m
  tests: true

# List of enabled linters (listed explicitly instead of relying on the
# "standard" default set, so a tool upgrade cannot silently add linters)
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  # Linter-specific settings
  settings:
    staticcheck:
      # v1 ran staticcheck (SA) and gosimple (S1) only. v2's staticcheck also
      # runs stylecheck (ST) and quickfix (QF); those stay off until reviewed.
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy
        - io.ReadAll

  exclusions:
    # Keep v1's behaviour: lax handling of generated files, and v1's default
    # exclusions (v1 applied them unless exclude-use-default was false)
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: Error return value is not checked.*\.Close\(
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

# Issues configuration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
