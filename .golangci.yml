# Minimal golangci-lint configuration (v2 schema; checked with golangci-lint v2.14.0)
#
# Migrated from the v1 file with v1's linter set: v1's gosimple is now part of
# staticcheck, and gofmt/goimports are formatters in v2. The refactor's
# next/p1d-lint added depguard, for the design system's import rules.

version: "2"

# Options for analysis running
run:
  timeout: 5m
  tests: true

# List of enabled linters (listed explicitly instead of relying on the
# "standard" default set, so a tool upgrade cannot silently add linters)
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Not in the "standard" set: v2 runs it only when enabled here.
    - depguard

  # Linter-specific settings
  settings:
    # The design system's import rules (docs/design-system/README.md §9.15).
    # A rule applies to the files its globs match, as absolute paths:
    # "${base-path}" is this file's directory (run.relative-path-mode's
    # default, cfg), so a glob holds wherever the tree is checked out; "$all"
    # is any Go file, "$test" a _test.go file, "!" excludes. A deny entry is
    # a prefix of the import path. Only the files of the host's build are
    # linted, so a linux-only file is checked on Linux alone; pkg/ui/prompt's
    # and pkg/ui/keys's TestImports read every non-test file whatever its
    # build tags.
    depguard:
      rules:
        # Charm's libraries are pkg/ui's alone: other code gets its output
        # from the components and the theme. Both module hosts, whole, so
        # that Lip Gloss and the colour, ANSI and terminal libraries under
        # it are covered, and any Charm module added later.
        charm:
          files:
            - "$all"
            - "!${base-path}/pkg/ui/**"
            - "!${base-path}/internal/tools/uigallery/**"
          deny:
            - pkg: charm.land/
              desc: Charm's libraries, Lip Gloss among them, are for pkg/ui only; build the screen from pkg/ui components (design-system README §9.15)
            - pkg: github.com/charmbracelet/
              desc: Charm's colour, ANSI and terminal libraries are for pkg/ui only; render through the components and term.Env (design-system README §9.15)
        # The dev-only gallery names colour profiles for term.Fixed and
        # measures its headers with x/ansi, and takes no other Charm library.
        # Lax: an import no entry denies passes, and the allow entries carve
        # those two out of the denied host.
        gallery:
          list-mode: lax
          files:
            - "${base-path}/internal/tools/uigallery/**"
          allow:
            - github.com/charmbracelet/colorprofile
            - github.com/charmbracelet/x/ansi
          deny:
            - pkg: charm.land/
              desc: the gallery takes colorprofile and x/ansi only; it renders through pkg/ui (design-system README §9.14)
            - pkg: github.com/charmbracelet/
              desc: the gallery takes colorprofile and x/ansi only; it renders through pkg/ui (design-system README §9.14)
        # Only pkg/ui/term looks at the terminal, in pkg/ui too: the terminal
        # queries in the module graph (x/term's prefix takes x/termios), and
        # golang.org/x/term.
        terminal:
          files:
            - "$all"
            - "!${base-path}/pkg/ui/term/**"
          deny:
            - pkg: github.com/charmbracelet/x/term
              desc: only pkg/ui/term looks at the terminal; use term.Env (design-system README §9.15)
            - pkg: github.com/mattn/go-isatty
              desc: only pkg/ui/term looks at the terminal; use term.Env (design-system README §9.15)
            - pkg: github.com/xo/terminfo
              desc: only pkg/ui/term looks at the terminal; use term.Env (design-system README §9.15)
            - pkg: golang.org/x/term
              desc: only pkg/ui/term looks at the terminal; use term.Env (design-system README §9.15)
        # The legacy styling, pkg/ui included, one rule per library, so that
        # each exception lifts only the denial of what its package imports
        # today. Each exception goes when its slice moves onto pkg/ui.
        legacy-color:
          files:
            - "$all"
            - "!${base-path}/cmd/hardn/**"
            - "!${base-path}/pkg/logging/**"
          deny:
            - pkg: github.com/fatih/color
              desc: legacy colour library; use pkg/ui (design-system README §9.15)
        legacy-style:
          files:
            - "$all"
            - "!${base-path}/pkg/menu/**"
            - "!${base-path}/cmd/hardn/**"
            - "!${base-path}/pkg/security/**"
            - "!${base-path}/pkg/system/**"
            - "!${base-path}/pkg/utils/**"
          deny:
            - pkg: github.com/abbott/hardn/pkg/style
              desc: legacy styling; use pkg/ui (design-system README §9.15)
        legacy-width:
          files:
            - "$all"
            - "!${base-path}/pkg/style/**" # the legacy library itself
            - "!${base-path}/pkg/menu/**"
          deny:
            - pkg: github.com/mattn/go-runewidth
              desc: legacy width helper; pkg/ui measures with Lip Gloss (design-system README §9.15)
        # Never, anywhere: the Lip Gloss that queries the terminal, Lip Gloss
        # v1, the libraries whose patterns are borrowed, and the input reader
        # and colour writer Lip Gloss and fatih/color bring in.
        never:
          files:
            - "$all"
          deny:
            - pkg: charm.land/lipgloss/v2/compat
              desc: queries the terminal and detects a profile at import (design-system README §2.3)
            - pkg: github.com/charmbracelet/lipgloss
              desc: Lip Gloss v1; hardn uses charm.land/lipgloss/v2 (design-system README §2.1)
            - pkg: charm.land/bubbletea
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: github.com/charmbracelet/bubbletea
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: charm.land/bubbles
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: github.com/charmbracelet/bubbles
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: charm.land/huh
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: github.com/charmbracelet/huh
              desc: patterns are borrowed, not imported (design-system README §9.15)
            - pkg: github.com/muesli/cancelreader
              desc: input is read by pkg/ui/prompt alone (design-system README §9.15)
            - pkg: github.com/mattn/go-colorable
              desc: output goes through term.Env's writer alone (design-system README §9.15)
        # The golden harness and the component states are for tests and the
        # dev tools only.
        test-only:
          files:
            - "$all"
            - "!$test"
            - "!${base-path}/internal/tools/**"
          deny:
            - pkg: github.com/abbott/hardn/pkg/ui/uitest
              desc: the golden harness is for tests only (design-system README §8)
            - pkg: github.com/abbott/hardn/pkg/ui/component/fixture
              desc: the component states are for tests and the gallery only (design-system README §9.14)
            - pkg: github.com/abbott/hardn/pkg/host/hostfake
              desc: the recording fake System is for tests and the dev tools only (docs/safety/system.md)
        # The dev tools import anything; nothing imports them.
        dev-tools:
          files:
            - "$all"
            - "!${base-path}/internal/tools/**"
          deny:
            - pkg: github.com/abbott/hardn/internal/tools
              desc: dev-only tools are never linked into hardn (design-system README §9.14)
        # The legacy menus read through pkg/ui/prompt, and can use
        # pkg/ui/keys, without linking Lip Gloss, so both keep to the
        # standard library, and prompt to x/sys/unix besides.
        prompt-stdlib:
          list-mode: strict
          files:
            - "${base-path}/pkg/ui/prompt/**"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/sys/unix
        keys-stdlib:
          list-mode: strict
          files:
            - "${base-path}/pkg/ui/keys/**"
            - "!$test"
          allow:
            - $gostd
        # The host seam, its fake, platform detection (pkg/host/detect) and
        # the backups (pkg/host/backup) keep to the standard library and
        # pkg/host: no third-party code is linked under the seam
        # (docs/safety/system.md, docs/safety/detect.md). x/sys/unix is the
        # one exception, for the guarded walk's openat family, which the
        # standard library's syscall lacks on macOS (docs/safety/atomic.md).
        host-stdlib:
          list-mode: strict
          files:
            - "${base-path}/pkg/host/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/abbott/hardn/pkg/host
            - golang.org/x/sys/unix
        # Platform detection reaches the host only through host.System: the
        # standard library's file, process and network packages are denied
        # (prefixes: os covers os/exec and os/user, net covers net/http).
        # syscall stays allowed for ENOTDIR (docs/safety/detect.md §5).
        detect-through-host:
          files:
            - "${base-path}/pkg/host/detect/**"
            - "!$test"
          deny:
            - pkg: os
              desc: detection reads and runs only through host.System (docs/safety/detect.md §2.2)
            - pkg: io/ioutil
              desc: detection reads only through host.System (docs/safety/detect.md §2.2)
            - pkg: golang.org/x/sys
              desc: detection makes no system calls of its own (docs/safety/detect.md §2.2)
            - pkg: net
              desc: detection makes no network calls (docs/safety/detect.md §2.2)
            - pkg: plugin
              desc: detection loads no code (docs/safety/detect.md §2.2)
        # sshd validation reads, writes and runs sshd only through
        # host.System, as detection does. Lax, so that the allow entry
        # carves net/netip (address parsing, for Match probes) out of net.
        sshd-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/sshd/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: sshd validation reads, writes and runs only through host.System (docs/safety/sshd-validate.md §2)
            - pkg: io/ioutil
              desc: sshd validation reads and writes only through host.System (docs/safety/sshd-validate.md §2)
            - pkg: golang.org/x/sys
              desc: sshd validation makes no system calls of its own (docs/safety/sshd-validate.md §2)
            - pkg: syscall
              desc: sshd validation makes no system calls of its own (docs/safety/sshd-validate.md §2)
            - pkg: net
              desc: sshd validation makes no network calls (docs/safety/sshd-validate.md §2)
            - pkg: plugin
              desc: sshd validation loads no code (docs/safety/sshd-validate.md §2)
        # The reload runs systemctl, rc-service and ss and reads the
        # socket's drop-ins only through host.System, as sshd validation
        # does; net/netip parses the listeners.
        reload-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/reload/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the reload reads and runs only through host.System (docs/safety/reload.md §2)
            - pkg: io/ioutil
              desc: the reload reads only through host.System (docs/safety/reload.md §2)
            - pkg: golang.org/x/sys
              desc: the reload makes no system calls of its own (docs/safety/reload.md §2)
            - pkg: syscall
              desc: the reload makes no system calls of its own (docs/safety/reload.md §2)
            - pkg: net
              desc: the reload makes no network calls; ss reads the bound sockets (docs/safety/reload.md §2)
            - pkg: plugin
              desc: the reload loads no code (docs/safety/reload.md §2)
        # next/p2-ufw: UFW is read and changed only through host.System,
        # as the reload is; net/netip parses addresses and prefixes.
        ufw-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/ufw/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: ufw is read and run only through host.System (docs/safety/ufw.md §2)
            - pkg: io/ioutil
              desc: ufw's files are read only through host.System (docs/safety/ufw.md §2)
            - pkg: golang.org/x/sys
              desc: the ufw unit makes no system calls of its own (docs/safety/ufw.md §2)
            - pkg: syscall
              desc: the ufw unit makes no system calls of its own (docs/safety/ufw.md §2)
            - pkg: net
              desc: the ufw unit makes no network calls (docs/safety/ufw.md §2)
            - pkg: plugin
              desc: the ufw unit loads no code (docs/safety/ufw.md §2)
        # next/p2-revert: the journal, the timer, the confirmation and the
        # rollback reach the host only through host.System, as the reload
        # does; net/netip parses SSH_CONNECTION and the listeners. hardn's
        # own path (os.Executable) and the session's environment and pid come
        # from cmd/hardn.
        revert-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/revert/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the revert unit reads, writes and runs only through host.System (docs/safety/revert.md §2)
            - pkg: io/ioutil
              desc: the revert unit reads and writes only through host.System (docs/safety/revert.md §2)
            - pkg: golang.org/x/sys
              desc: the revert unit makes no system calls of its own (docs/safety/revert.md §2)
            - pkg: syscall
              desc: the revert unit makes no system calls of its own (docs/safety/revert.md §2)
            - pkg: net
              desc: the revert unit makes no network calls (docs/safety/revert.md §2)
            - pkg: plugin
              desc: the revert unit loads no code (docs/safety/revert.md §2)
        # next/p2-pve: the Proxmox VE rules read sshd's values, root's keys
        # and pve-firewall's files, and write the keys, only through
        # host.System; pve-firewall is read, never run. net/netip reads
        # ListenAddress's address.
        pve-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/pve/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the Proxmox VE unit reads, writes and runs only through host.System (docs/safety/pve.md §2)
            - pkg: io/ioutil
              desc: the Proxmox VE unit reads and writes only through host.System (docs/safety/pve.md §2)
            - pkg: golang.org/x/sys
              desc: the Proxmox VE unit makes no system calls of its own (docs/safety/pve.md §2)
            - pkg: syscall
              desc: the Proxmox VE unit makes no system calls of its own (docs/safety/pve.md §2)
            - pkg: net
              desc: the Proxmox VE unit makes no network calls (docs/safety/pve.md §2)
            - pkg: plugin
              desc: the Proxmox VE unit loads no code (docs/safety/pve.md §2)
        # next/p2-sudoers: the sudoers and doas rules are read, checked
        # (visudo, doas -C) and written only through host.System, as the
        # sshd units do.
        sudoers-through-host:
          files:
            - "${base-path}/pkg/host/sudoers/**"
            - "!$test"
          deny:
            - pkg: os
              desc: the sudoers unit reads, writes and runs only through host.System (docs/safety/sudoers.md §2)
            - pkg: io/ioutil
              desc: the sudoers unit reads and writes only through host.System (docs/safety/sudoers.md §2)
            - pkg: golang.org/x/sys
              desc: the sudoers unit makes no system calls of its own (docs/safety/sudoers.md §2)
            - pkg: syscall
              desc: the sudoers unit makes no system calls of its own (docs/safety/sudoers.md §2)
            - pkg: net
              desc: the sudoers unit makes no network calls (docs/safety/sudoers.md §2)
            - pkg: plugin
              desc: the sudoers unit loads no code (docs/safety/sudoers.md §2)
        # next/p2-alpine: apk-cron, crond, the legacy apk-upgrade file and
        # the AppArmor and Lynis reports are read, run and changed only
        # through host.System, as the sudoers unit does.
        alpine-through-host:
          files:
            - "${base-path}/pkg/host/alpine/**"
            - "!$test"
          deny:
            - pkg: os
              desc: the Alpine unit reads, writes and runs only through host.System (docs/safety/alpine.md §2)
            - pkg: io/ioutil
              desc: the Alpine unit reads and writes only through host.System (docs/safety/alpine.md §2)
            - pkg: golang.org/x/sys
              desc: the Alpine unit makes no system calls of its own (docs/safety/alpine.md §2)
            - pkg: syscall
              desc: the Alpine unit makes no system calls of its own (docs/safety/alpine.md §2)
            - pkg: net
              desc: the Alpine unit makes no network calls (docs/safety/alpine.md §2)
            - pkg: plugin
              desc: the Alpine unit loads no code (docs/safety/alpine.md §2)
        # next/p2-dns: /etc/resolv.conf, systemd-resolved's drop-ins and
        # udhcpc.conf are read and written, and systemctl and resolvectl
        # run, only through host.System. Lax, so that the allow entry
        # carves net/netip (nameserver validation) out of net.
        dns-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/host/dns/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the DNS unit reads, writes and runs only through host.System (docs/safety/dns.md §2)
            - pkg: io/ioutil
              desc: the DNS unit reads and writes only through host.System (docs/safety/dns.md §2)
            - pkg: golang.org/x/sys
              desc: the DNS unit makes no system calls of its own (docs/safety/dns.md §2)
            - pkg: syscall
              desc: the DNS unit makes no system calls of its own (docs/safety/dns.md §2)
            - pkg: net
              desc: the DNS unit makes no network calls; net/netip only parses (docs/safety/dns.md §2)
            - pkg: plugin
              desc: the DNS unit loads no code (docs/safety/dns.md §2)
        # next/p3-engine: the plan/apply engine reaches the host only through
        # host.System, as the Phase 2 units do, and renders nothing: its
        # plans and results are data that pkg/ui's components render.
        # pkg/engine/hold, the signal hold around an in-process rollback, is
        # the one part that touches the process (os/signal, syscall).
        engine-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/**"
            - "!${base-path}/pkg/engine/hold/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the engine reads, writes and runs only through host.System (docs/engine/engine.md §2)
            - pkg: io/ioutil
              desc: the engine reads and writes only through host.System (docs/engine/engine.md §2)
            - pkg: golang.org/x/sys
              desc: the engine makes no system calls of its own (docs/engine/engine.md §2)
            - pkg: syscall
              desc: the engine makes no system calls of its own; signals are pkg/engine/hold's (docs/engine/engine.md §2)
            - pkg: net
              desc: the engine makes no network calls (docs/engine/engine.md §2)
            - pkg: plugin
              desc: the engine loads no code (docs/engine/engine.md §2)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: the engine returns data and renders nothing; p3-output and the slices render it (docs/engine/engine.md §2)
        # next/p3-steps: the engine's change kinds over the Phase 2
        # primitives reach the host only through host.System, as the engine
        # and the primitives do, and render nothing. (engine-through-host's
        # glob covers the directory too; this block names the unit's own
        # rule, so that a later change to that glob does not drop it.)
        steps-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/steps/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the change kinds read, write and run only through host.System (docs/engine/steps.md §2)
            - pkg: io/ioutil
              desc: the change kinds read and write only through host.System (docs/engine/steps.md §2)
            - pkg: golang.org/x/sys
              desc: the change kinds make no system calls of their own (docs/engine/steps.md §2)
            - pkg: syscall
              desc: the change kinds make no system calls of their own (docs/engine/steps.md §2)
            - pkg: net
              desc: the change kinds make no network calls (docs/engine/steps.md §2)
            - pkg: plugin
              desc: the change kinds load no code (docs/engine/steps.md §2)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: the change kinds are data; p3-output and the slices render them (docs/engine/steps.md §2)
        # next/p3-output: the output contract (the wire types, the code
        # registry, the renderers, the audit log) reaches the host only
        # through host.System, the audit log through its AppendFile, writes
        # only to the io.Writers it is given, and renders through pkg/ui
        # alone (docs/engine/output.md §2).
        output-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/output/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the output contract reads and writes only through host.System and the writers it is given (docs/engine/output.md §2)
            - pkg: io/ioutil
              desc: the output contract reads and writes only through host.System (docs/engine/output.md §2)
            - pkg: golang.org/x/sys
              desc: the output contract makes no system calls of its own (docs/engine/output.md §2)
            - pkg: syscall
              desc: the output contract makes no system calls of its own (docs/engine/output.md §2)
            - pkg: net
              desc: the output contract makes no network calls (docs/engine/output.md §2)
            - pkg: plugin
              desc: the output contract loads no code (docs/engine/output.md §2)
        # next/p3-confirm-cleanup: hardn confirm's claim and clean-up
        # (P-40) reach the host only through host.System and the engine, as
        # the engine and its change kinds do, and render nothing: cmd/hardn
        # renders their results through pkg/output. (engine-through-host's
        # glob covers the directory too; this block names the unit's own
        # rule, so that a later change to that glob does not drop it.)
        confirm-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/confirm/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: hardn confirm's clean-up reads, writes and runs only through host.System (docs/engine/confirm-cleanup.md §2)
            - pkg: io/ioutil
              desc: hardn confirm's clean-up reads and writes only through host.System (docs/engine/confirm-cleanup.md §2)
            - pkg: golang.org/x/sys
              desc: hardn confirm's clean-up makes no system calls of its own (docs/engine/confirm-cleanup.md §2)
            - pkg: syscall
              desc: hardn confirm's clean-up makes no system calls of its own (docs/engine/confirm-cleanup.md §2)
            - pkg: net
              desc: hardn confirm's clean-up makes no network calls (docs/engine/confirm-cleanup.md §2)
            - pkg: plugin
              desc: hardn confirm's clean-up loads no code (docs/engine/confirm-cleanup.md §2)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: hardn confirm's clean-up returns data; cmd/hardn renders it through pkg/output (docs/engine/confirm-cleanup.md §2)
            - pkg: github.com/abbott/hardn/pkg/output
              desc: hardn confirm's clean-up returns data; cmd/hardn renders it through pkg/output (docs/engine/confirm-cleanup.md §2)
        # next/p4-check-ssh: the status controls, one package per area under
        # pkg/engine/controls, read the host only through host.System and
        # the Phase 2 readers, and render nothing: Engine.Check's reports are
        # data that pkg/output and the main menu render. One rule for every
        # area, so an area's package needs no block of its own
        # (docs/engine/checks.md). (engine-through-host's glob covers the
        # directory too; this block names the rule, so that a later change
        # to that glob does not drop it.)
        controls-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/controls/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: a status control reads only through host.System (docs/engine/checks.md)
            - pkg: io/ioutil
              desc: a status control reads only through host.System (docs/engine/checks.md)
            - pkg: golang.org/x/sys
              desc: a status control makes no system calls of its own (docs/engine/checks.md)
            - pkg: syscall
              desc: a status control makes no system calls of its own (docs/engine/checks.md)
            - pkg: net
              desc: a status control makes no network calls (docs/engine/checks.md)
            - pkg: plugin
              desc: a status control loads no code (docs/engine/checks.md)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: a status control returns data; pkg/output and the main menu render it (docs/engine/checks.md)
            - pkg: github.com/abbott/hardn/pkg/output
              desc: a status control returns data; pkg/output and the main menu render it (docs/engine/checks.md)
        # next/p4-check-users: /etc/passwd and /etc/group are read only
        # through host.System, as the sudoers unit reads its files.
        accounts-through-host:
          files:
            - "${base-path}/pkg/host/accounts/**"
            - "!$test"
          deny:
            - pkg: os
              desc: the accounts reader reads only through host.System (docs/engine/check-users.md §2)
            - pkg: io/ioutil
              desc: the accounts reader reads only through host.System (docs/engine/check-users.md §2)
            - pkg: golang.org/x/sys
              desc: the accounts reader makes no system calls of its own (docs/engine/check-users.md §2)
            - pkg: syscall
              desc: the accounts reader makes no system calls of its own (docs/engine/check-users.md §2)
            - pkg: net
              desc: the accounts reader makes no network calls (docs/engine/check-users.md §2)
            - pkg: plugin
              desc: the accounts reader loads no code (docs/engine/check-users.md §2)
        # next/p4-header: the main menu's header probe reads the host only
        # through host.System, as the status controls do, and renders
        # nothing: pkg/output maps what it read to the header blocks.
        # (engine-through-host's glob covers the directory too; this block
        # names the unit's own rule, so that a later change to that glob
        # does not drop it.) net/netip holds the addresses it reads.
        header-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/header/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the header probe reads only through host.System (docs/engine/header.md §2)
            - pkg: io/ioutil
              desc: the header probe reads only through host.System (docs/engine/header.md §2)
            - pkg: golang.org/x/sys
              desc: the header probe makes no system calls of its own (docs/engine/header.md §2)
            - pkg: syscall
              desc: the header probe makes no system calls of its own (docs/engine/header.md §2)
            - pkg: net
              desc: the header probe makes no network calls; it reads the kernel's tables (docs/engine/header.md §2)
            - pkg: plugin
              desc: the header probe loads no code (docs/engine/header.md §2)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: the header probe returns data; pkg/output maps it to the header blocks (docs/engine/header.md §2)
            - pkg: github.com/abbott/hardn/pkg/output
              desc: the header probe returns data; pkg/output maps it to the header blocks (docs/engine/header.md §2)
        # next/p4-vmcheck: internal/tools/p4status, the read-only driver of
        # Phase 4 on a host, reaches the host only through its guard over
        # host.System, which refuses every change and runs only the
        # commands the checks run (docs/engine/vmcheck.md §2). main.go
        # alone takes the process (stdout, stderr, the arguments, the
        # user, the signals) and builds host.Real; no file runs a command
        # or makes a system call of its own.
        p4status-through-host:
          files:
            - "${base-path}/internal/tools/p4status/**"
            - "!${base-path}/internal/tools/p4status/main.go"
            - "!$test"
          deny:
            - pkg: os
              desc: p4status reaches the host only through its guard (docs/engine/vmcheck.md §2)
            - pkg: io/ioutil
              desc: p4status reads only through its guard (docs/engine/vmcheck.md §2)
            - pkg: golang.org/x/sys
              desc: p4status makes no system calls of its own (docs/engine/vmcheck.md §2)
            - pkg: syscall
              desc: p4status makes no system calls of its own (docs/engine/vmcheck.md §2)
            - pkg: net
              desc: p4status makes no network calls (docs/engine/vmcheck.md §2)
            - pkg: plugin
              desc: p4status loads no code (docs/engine/vmcheck.md §2)
        p4status-main:
          files:
            - "${base-path}/internal/tools/p4status/main.go"
          deny:
            - pkg: os/exec
              desc: p4status runs commands only through its guard (docs/engine/vmcheck.md §2)
            - pkg: io/ioutil
              desc: p4status reads only through its guard (docs/engine/vmcheck.md §2)
            - pkg: golang.org/x/sys
              desc: p4status makes no system calls of its own (docs/engine/vmcheck.md §2)
            - pkg: net
              desc: p4status makes no network calls (docs/engine/vmcheck.md §2)
            - pkg: plugin
              desc: p4status loads no code (docs/engine/vmcheck.md §2)
        # next/s2-control (refactor plan slice 2, unit (b)): the DNS control
        # reads and plans only through host.System, pkg/host/dns and
        # pkg/engine/steps, and renders nothing: its statuses and plans are
        # data that pkg/output renders. (controls-through-host's glob covers
        # the directory too; this block names the unit's own rule, so that
        # a later change to that glob does not drop it.)
        dns-control-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/engine/controls/dns/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the DNS control reads and plans only through host.System (docs/engine/control-dns.md §2)
            - pkg: io/ioutil
              desc: the DNS control reads only through host.System (docs/engine/control-dns.md §2)
            - pkg: golang.org/x/sys
              desc: the DNS control makes no system calls of its own (docs/engine/control-dns.md §2)
            - pkg: syscall
              desc: the DNS control makes no system calls of its own (docs/engine/control-dns.md §2)
            - pkg: net
              desc: the DNS control makes no network calls; net/netip only parses (docs/engine/control-dns.md §2)
            - pkg: plugin
              desc: the DNS control loads no code (docs/engine/control-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/ui
              desc: the DNS control returns data; pkg/output renders it (docs/engine/control-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/output
              desc: the DNS control returns data; pkg/output renders it (docs/engine/control-dns.md §2)
        # next/s2-screen (refactor plan slice 2, unit (c)): the DNS screen's
        # glue reads and changes the host only through host.System, the DNS
        # control, pkg/host/dns and the engine, and draws only through
        # pkg/ui and pkg/output: no file, process or network of its own.
        screens-dns-through-host:
          list-mode: lax
          files:
            - "${base-path}/pkg/screens/dns/**"
            - "!$test"
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: the DNS screen reads and changes the host only through host.System and the engine (docs/engine/screen-dns.md §2)
            - pkg: io/ioutil
              desc: the DNS screen reads only through host.System (docs/engine/screen-dns.md §2)
            - pkg: golang.org/x/sys
              desc: the DNS screen makes no system calls of its own (docs/engine/screen-dns.md §2)
            - pkg: syscall
              desc: the DNS screen makes no system calls of its own (docs/engine/screen-dns.md §2)
            - pkg: net
              desc: the DNS screen makes no network calls; net/netip only parses (docs/engine/screen-dns.md §2)
            - pkg: plugin
              desc: the DNS screen loads no code (docs/engine/screen-dns.md §2)
        # next/s2-screen: pkg/ui draws and asks, and never reaches the host,
        # the engine, hardn.yml or the output contract: what a screen shows
        # of them comes in as its view-model, filled by the area's glue
        # (pkg/screens/<area>), so that a layout cannot read the host.
        ui-renders-only:
          files:
            - "${base-path}/pkg/ui/**"
            - "!$test"
          deny:
            - pkg: github.com/abbott/hardn/pkg/host
              desc: pkg/ui draws view-models; the area's glue reads the host (docs/engine/screen-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/engine
              desc: pkg/ui draws view-models; pkg/output and the area's glue run the engine (docs/engine/screen-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/config
              desc: pkg/ui draws view-models; the area's glue reads hardn.yml (docs/engine/screen-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/output
              desc: pkg/output renders through pkg/ui, never the other way (docs/engine/screen-dns.md §2)
            - pkg: github.com/abbott/hardn/pkg/screens
              desc: the areas' glue draws through pkg/ui, never the other way (docs/engine/screen-dns.md §2)
    staticcheck:
      # v1 ran staticcheck (SA) and gosimple (S1) only. v2's staticcheck also
      # runs stylecheck (ST) and quickfix (QF); those stay off until reviewed.
      checks:
        - "all"
        - "-ST*"
        - "-QF*"
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy
        - io.ReadAll

  exclusions:
    # Keep v1's behaviour: lax handling of generated files, and v1's default
    # exclusions (v1 applied them unless exclude-use-default was false)
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: Error return value is not checked.*\.Close\(
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$

# Issues configuration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
