name: Build

# p7-provenance. The release build, as a reusable workflow that release.yml
# calls on a tag push: the three binaries and their SLSA build provenance,
# with each attestation's Sigstore bundle as hardn-<os>-<arch>.sigstore.json.
#
# SLSA Build Level 3 (GitHub's "Using artifact attestations and reusable
# workflows to achieve SLSA v1 Build Level 3"): the build and actions/attest
# run in this reusable workflow, so the signing certificate names this file,
# not the caller, as the signer. A release is verified with
#   gh attestation verify <binary> --repo abbott/hardn \
#     --cert-identity https://github.com/abbott/hardn/.github/workflows/build.yml@refs/tags/v<x.y.z> \
#     --source-ref refs/tags/v<x.y.z> --deny-self-hosted-runners
# release.yml does that to every binary before it publishes.
#
# Inputs are what release.yml's prepare job computed. Every run attests:
# release.yml runs only on a tag push (no workflow_dispatch), and ci.yml's
# check-cross does the build-only runs, without id-token.
#
# The build steps are p7-release's, unchanged: go.mod's toolchain,
# CGO_ENABLED=0, -trimpath, -tags=netgo, ldflags from the tagged commit. The
# makefile's LDFLAGS targets and check-cross use the same values and flags.

on:
  workflow_call:
    inputs:
      version:
        description: main.Version (the tag without its v)
        required: true
        type: string
      commit:
        description: main.GitCommit (the commit built)
        required: true
        type: string
      build-date:
        description: main.BuildDate (the commit's date, UTC)
        required: true
        type: string

permissions: {}

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # GitHub's guide gives these three to both the caller's job and this one.
    # id-token: the OIDC token for the Sigstore certificate; attestations:
    # store the attestation.
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      # The release targets (decision 6). The makefile's CHECK_CROSS_TARGETS
      # names the same three.
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false  # No cache in a release (cache poisoning)

      - name: Go is go.mod's toolchain line
        run: |
          set -eu
          want_go=$(sed -n 's/^toolchain //p' go.mod)
          got_go=$(GOTOOLCHAIN=local go env GOVERSION)
          [ -n "$want_go" ] && [ "$got_go" = "$want_go" ] || {
            echo "::error file=go.mod::setup-go installed $got_go, not go.mod's toolchain line ($want_go)"
            exit 1
          }

      # The makefile's check-cross flags; its LDFLAGS set the same variables.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          BUILD_DATE: ${{ inputs.build-date }}
        run: |
          set -euo pipefail
          out="dist/hardn-${GOOS}-${GOARCH}"
          go build -trimpath -tags=netgo \
            -ldflags "-X main.Version=${VERSION} -X main.GitCommit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$out" ./cmd/hardn
          go version -m "$out"
          sha256sum "$out"

      # SLSA v1 build provenance (no sbom-path or predicate inputs), signed
      # with a Sigstore certificate for this workflow and stored with
      # GitHub's attestations API for the repository.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/hardn-${{ matrix.goos }}-${{ matrix.goarch }}

      # The attestation's Sigstore bundle becomes a release asset, so a host
      # with no network can check the binary with gh attestation verify
      # --bundle. actions/attest writes it to a new directory under
      # RUNNER_TEMP, one JSON line (src/main.ts, the bundle-path output).
      - name: Keep the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          OUT: dist/hardn-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json
        run: |
          set -euo pipefail
          [ -s "$BUNDLE" ] || { echo "::error::actions/attest wrote no bundle at '$BUNDLE'"; exit 1; }
          [ "$(wc -l < "$BUNDLE")" -eq 1 ] || { echo "::error::$BUNDLE is not one bundle"; exit 1; }
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "$BUNDLE" > /dev/null || {
            echo "::error::$BUNDLE is not a Sigstore bundle"
            exit 1
          }
          cp "$BUNDLE" "$OUT"
          sha256sum "$OUT"

      - name: Upload the binary and its bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/hardn-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/hardn-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json
          if-no-files-found: error
          retention-days: 7
