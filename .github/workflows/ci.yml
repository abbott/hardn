name: CI

# p7-actions. Static checks only on the maintainer's machine (actionlint and
# zizmor, make check-actions): this workflow runs on GitHub's runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # GOWORK and GOFLAGS match the makefile's check targets. GOTOOLCHAIN=local
  # (use the Go that was installed; never download another) is not set here:
  # setup-go reads go.mod's toolchain line only when GOTOOLCHAIN is not local
  # (src/installer.ts, parseGoVersionFile), and would install the go line's
  # Go instead. setup-go exports GOTOOLCHAIN=local for the steps after it;
  # the Alpine install step does the same.
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep in step with the makefile's CHECK_*_VERSION; the version-compare
      # step fails if they differ. Each SHA-256 is the linux-amd64 archive's, from
      # the release's checksums file or, for zizmor and shellcheck, which
      # publish none, GitHub's digest of the release asset.
      GOLANGCI_LINT_VERSION: 2.14.0
      GOLANGCI_LINT_SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
      GOVULNCHECK_VERSION: v1.9.0
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # actionlint runs it on every run: script. The runner image has its own
      # shellcheck; the install step puts this one first on PATH.
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compare tool versions with the makefile, and Go with go.mod
        run: |
          set -eu
          # The Go setup-go installed must be go.mod's toolchain line.
          want_go=$(sed -n 's/^toolchain //p' go.mod)
          got_go=$(GOTOOLCHAIN=local go env GOVERSION)
          [ -n "$want_go" ] && [ "$got_go" = "$want_go" ] || {
            echo "::error file=go.mod::setup-go installed $got_go, not go.mod's toolchain line ($want_go)"
            exit 1
          }
          want() { # want <makefile variable> <version ci.yml installs>
            grep -qx "$1 ?= $2" makefile || {
              echo "::error file=makefile::$1 is not $2, the version ci.yml installs"
              exit 1
            }
          }
          want CHECK_GOLANGCI_LINT_VERSION "$GOLANGCI_LINT_VERSION"
          want CHECK_GOVULNCHECK_VERSION "$GOVULNCHECK_VERSION"
          want CHECK_ZIZMOR_VERSION "$ZIZMOR_VERSION"
          want CHECK_ACTIONLINT_VERSION "$ACTIONLINT_VERSION"
          want CHECK_SHELLCHECK_VERSION "$SHELLCHECK_VERSION"

      - name: Install golangci-lint, govulncheck, zizmor, actionlint and shellcheck
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"
          fetch() { # fetch <url> <sha256>: download into $dl and check the SHA-256
            # --retry 8 backs off from 1 s to 128 s, about 4 minutes, to outlast a GitHub 5xx spell.
            f="$dl/${1##*/}"
            curl -fsSL --retry 8 -o "$f" "$1"
            echo "$2  $f" | sha256sum -c -
          }
          fetch "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" "$GOLANGCI_LINT_SHA256"
          tar -xzf "$f" -C "$bin" --strip-components=1 "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "$ZIZMOR_SHA256"
          tar -xzf "$f" -C "$bin" zizmor
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256"
          tar -xzf "$f" -C "$bin" actionlint
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" "$SHELLCHECK_SHA256"
          tar -xzf "$f" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # go install checks the module against go.sum's database (sum.golang.org).
          GOBIN="$bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # GITHUB_PATH prepends: these come before the runner's own copies.
          echo "$bin" >> "$GITHUB_PATH"

      # On this Linux host the other steps compile the Linux files, so
      # check-cross vets the darwin side instead of linux/amd64 (the
      # makefile's CHECK_CROSS_VET_TARGETS assumes a darwin host).
      - name: make check
        run: make check CHECK_CROSS_VET_TARGETS="linux/arm64 darwin/amd64"

  linux:
    # go vet and go test on each supported distribution's image (decision 5).
    name: go test (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian:13
            image: debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
            family: debian
          - name: debian:12
            image: debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880
            family: debian
          - name: ubuntu:26.04
            image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
            family: debian
          - name: ubuntu:24.04
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
            family: debian
          - name: alpine:3.24
            image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            family: alpine
          - name: alpine:3.23
            image: alpine:3.23@sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63
            family: alpine
          # Rocky Linux's own images: the library's rockylinux has no 10, and its 9
          # stopped in 2024.
          - name: rockylinux:10
            image: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
            family: el
          - name: rockylinux:9
            image: rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
            family: el
          - name: almalinux:10
            image: almalinux:10@sha256:5a4b41a427c9717be8f4ac2a32aa22efbae5f9124fbcb79a6765394f312acfe8
            family: el
          - name: almalinux:9
            image: almalinux:9@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2
            family: el
          # Red Hat's Universal Base Images, freely redistributable: RHEL's
          # userland (at 10.2 and 9.8) with no subscription.
          - name: ubi10
            image: redhat/ubi10:10.2@sha256:65201965dbdf33aecf3796ba454684be29083708fadb6335507b86a56d2df06c
            family: el
          - name: ubi9
            image: redhat/ubi9:9.8@sha256:87f66688da4e206d5a1877088626c542288a5ccd97898cf363b588d57817e6be
            family: el
    container:
      image: ${{ matrix.image }}
      # Rocky Linux's images set no PATH (their config holds only
      # container=oci), and the runner builds a step's PATH on the image's:
      # once setup-go added Go's, that was all PATH held, and the next step
      # found no sh. This is the PATH the other images set.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: sh
    steps:
      # The images ship no CA certificates (Debian, Ubuntu), which Go needs to
      # download modules, and no curl or jq (Alpine), which the Go install
      # below needs.
      - name: Install packages (Debian, Ubuntu)
        if: matrix.family == 'debian'
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates

      - name: Install packages (Alpine)
        if: matrix.family == 'alpine'
        run: apk add --no-cache ca-certificates curl jq

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rocky Linux, AlmaLinux and UBI images need nothing installed: they
      # ship the CA bundle, and the tar and gzip that checkout (no git there,
      # as on Debian) and setup-go unpack with (UBI's: Red Hat's rpm manifest).
      - name: Set up Go from go.mod (Debian, Ubuntu, Rocky Linux, AlmaLinux, UBI)
        if: matrix.family != 'alpine'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # setup-go does not support Alpine: the Go it installs is built for the
      # hosted runner, and its maintainers closed actions/setup-go#263 (Go
      # failing in an alpine container) as expected behaviour. go.dev's
      # linux-amd64 binaries are statically linked, so they run on musl. The
      # version is go.mod's, as setup-go reads it: the toolchain directive if
      # there is one, otherwise the go directive.
      - name: Install Go from go.dev (Alpine)
        if: matrix.family == 'alpine'
        run: |
          set -eu
          [ "$(uname -m)" = x86_64 ] || { echo "::error::expected an x86_64 runner, got $(uname -m)"; exit 1; }
          v=$(sed -n 's/^toolchain go//p' go.mod)
          [ -n "$v" ] || v=$(sed -n 's/^go //p' go.mod)
          f="go${v}.linux-amd64.tar.gz"
          sum=$(curl -fsSL --retry 8 'https://go.dev/dl/?mode=json&include=all' |
            jq -r --arg f "$f" '.[].files[] | select(.filename == $f) | .sha256')
          [ -n "$sum" ] || { echo "::error::go.dev/dl lists no SHA-256 for $f"; exit 1; }
          curl -fsSL --retry 8 -o "$RUNNER_TEMP/$f" "https://go.dev/dl/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C /usr/local -xzf "$RUNNER_TEMP/$f"
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo GOTOOLCHAIN=local >> "$GITHUB_ENV"

      - name: go vet
        run: |
          set -eu
          v=$(go env GOVERSION)
          echo "$v, GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          [ "$v" = "$(sed -n 's/^toolchain //p' go.mod)" ] || {
            echo "::error file=go.mod::installed $v, not go.mod's toolchain line"
            exit 1
          }
          go vet ./...

      - name: go test
        run: go test -count=1 ./...
