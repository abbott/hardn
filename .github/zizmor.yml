# zizmor's configuration (p7-actions). zizmor finds this file itself, from the
# repository root: make check-actions, CI's check job and the zizmor workflow
# pass no --config.
#
# No exceptions: every action and reusable workflow is hash-pinned (the
# unpinned-uses default). p7-release removed the one exception, for the SLSA
# Go builder's reusable workflow, with the builder.
#
# Two inline suppressions, both self-repository: release.yml's calls to
# ./.github/workflows/build.yml (p7-provenance) and ./.github/workflows/ci.yml,
# because actionlint 1.7.12 rejects the $/ form zizmor asks for. The reason
# is beside build's.
rules: {}
