# Managed by hardn.
# From /etc/ssh/sshd_config.d/hardn.conf:
Protocol 2
StrictModes yes
Port 2230
ListenAddress 0.0.0.0
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers alice
PasswordAuthentication no
PermitEmptyPasswords no
# Every key file the files hardn replaced named, so that no key stops working:
AuthorizedKeysFile .ssh_%u .ssh_%u/authorized_keys .ssh/authorized_keys
