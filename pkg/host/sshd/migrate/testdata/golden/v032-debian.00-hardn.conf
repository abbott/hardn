# Managed by hardn.
# From /etc/ssh/sshd_config.d/manage.conf:
Protocol 2
StrictModes yes
ListenAddress 0.0.0.0:2230
AuthenticationMethods publickey
PubkeyAuthentication yes
HostbasedAcceptedKeyTypes ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,ssh-ed25519
PermitRootLogin no
AllowUsers alice
PasswordAuthentication no
PermitEmptyPasswords no
# Every key file the files hardn replaced named, so that no key stops working:
AuthorizedKeysFile .ssh/authorized_keys .ssh_%u/authorized_keys
