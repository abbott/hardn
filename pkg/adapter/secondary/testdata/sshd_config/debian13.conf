# Synthetic fixture modelled on a Debian 13 sshd_config (hardn tests).
# Include first, so drop-ins win (sshd uses the first value it reads).

Include /etc/ssh/sshd_config.d/*.conf

Port 2230
#AddressFamily any
#ListenAddress 0.0.0.0

#LoginGraceTime 2m
#PermitRootLogin prohibit-password
#StrictModes yes

KbdInteractiveAuthentication no
UsePAM yes
X11Forwarding yes
PrintMotd no

AcceptEnv LANG LC_*

Subsystem	sftp	/usr/lib/openssh/sftp-server

# Example of overriding settings on a per-user basis
#Match User anoncvs
#	X11Forwarding no
#	PermitTTY no
